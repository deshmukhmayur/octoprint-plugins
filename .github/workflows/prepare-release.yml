name: Prepare release

# On every push to main that has change files in .changeset/, (re)build the release PR:
# knope bumps versions, writes changelogs and pushes the `release` branch; we then open or update
# the release PR with a title and body listing what it will publish.
# Merging that PR runs release.yml.
on:
  push:
    branches: [main]

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    # Skip the merge of the release PR itself.
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        name: Look for change files
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change files; nothing to release."
          fi
      - if: steps.changes.outputs.found == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.changes.outputs.found == 'true'
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.24.0
      - if: steps.changes.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          knope prepare-release --verbose
      - if: steps.changes.outputs.found == 'true'
        name: Open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/releases.py release-pr origin/main > "$RUNNER_TEMP/pr.json"
          title=$(jq -r .title "$RUNNER_TEMP/pr.json")
          jq -r .body "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/body.md"
          number=$(gh pr list --head release --base main --state open --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head release --base main --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
