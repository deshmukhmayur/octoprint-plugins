name: Release

# Runs when the release PR (branch `release`, opened by prepare-release.yml) is merged.
#
# Everything happens in this one workflow on purpose:
# - Tags and releases created with GITHUB_TOKEN don't trigger other workflows, so a separate
#   tag-triggered publish workflow would never run.
# - PyPI Trusted Publishing is registered against this file name (release.yml).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged && github.head_ref == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - id: plan
        name: Find plugins to release
        run: |
          releases=$(python3 scripts/releases.py pending)
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "Releasing: $releases"
      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.24.0
      - name: Create tags and GitHub releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release --verbose

  build:
    needs: release
    if: needs.release.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.release.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build "plugins/${{ matrix.plugin }}" --out-dir dist
      - name: Build Plugin Manager archive
        # A zip of the plugin's source folder; pip installs it directly. Served as <plugin>/latest.zip.
        run: |
          mkdir -p archive
          git archive --format=zip --prefix="${{ matrix.plugin }}/" \
            -o archive/latest.zip "HEAD:plugins/${{ matrix.plugin }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.plugin }}
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.plugin }}
          path: archive/

  publish-pypi:
    needs: [release, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
    strategy:
      matrix:
        include: ${{ fromJSON(needs.release.outputs.releases) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.plugin }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.release.outputs.releases) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.plugin }}
          path: dist/
      - name: Attach built files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ matrix.tag }}" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pages:
    needs: [release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives/
      - name: Update <plugin>/latest.zip on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site && git -C site remote add origin "$url"
            touch site/.nojekyll
          fi
          for dir in archives/archive-*; do
            plugin="${dir#archives/archive-}"
            mkdir -p "site/$plugin"
            cp "$dir/latest.zip" "site/$plugin/latest.zip"
          done
          cd site
          git add -A
          git commit -m "Publish release from PR #${{ github.event.pull_request.number }}"
          git push origin gh-pages
