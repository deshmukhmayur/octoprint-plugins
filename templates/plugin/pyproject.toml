[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "__package_name__"
version = "0.1.0"
description = "__description__"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "deshmukhmayur" }]
requires-python = ">=3.9,<4"
# OctoPrint itself is deliberately not listed: plugins run inside an existing OctoPrint install.
dependencies = []
classifiers = [
    "Framework :: OctoPrint",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/deshmukhmayur/octoprint-plugins/tree/main/plugins/__identifier__"
Source = "https://github.com/deshmukhmayur/octoprint-plugins"
Changelog = "https://github.com/deshmukhmayur/octoprint-plugins/blob/main/plugins/__identifier__/CHANGELOG.md"

# The key is the plugin identifier. It must never change once the plugin is published.
[project.entry-points."octoprint.plugin"]
__identifier__ = "octoprint___identifier__"

[tool.setuptools.packages.find]
include = ["octoprint___identifier__*"]

[tool.setuptools.package-data]
octoprint___identifier__ = ["static/**/*", "templates/**/*", "translations/**/*"]
